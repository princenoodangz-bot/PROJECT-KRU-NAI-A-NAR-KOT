<div class="px-margin-mobile">
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-md flex flex-col">

<!-- Tab สลับประเภทล็อกอิน -->
<div class="relative overflow-hidden p-1 bg-surface-container rounded-lg mb-space-md select-none">
  <div class="grid grid-cols-2 gap-1 relative z-10 text-center">
    <button class="py-2 px-2 rounded-md font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface font-medium flex items-center justify-center gap-1.5" id="tabEmail" type="button">

<form id="loginForm" class="flex flex-col gap-space-md" onsubmit="handleLoginSubmit(event)">

<input required class="w-full bg-surface-container-low pl-10 pr-3.5 py-3 rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-all duration-200 shadow-sm" id="identifierInput" placeholder="EXP-2026-XXXXX" type="text">
</div>

<button aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant hover:text-on-surface p-1 rounded-md transition-colors duration-150 flex items-center justify-center" id="togglePassword" type="button">

</button>

</div>

<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="peer sr-only" id="rememberMe" type="checkbox">

<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity duration-150">check</span>

<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">จดจำการเข้าสู่ระบบ</span>
</label>
<a class="font-label-sm text-label-sm font-semibold text-primary hover:text-primary-container transition-colors duration-150" href="#">

</a>

<button id="btnSubmitLogin" class="w-full mt-1 bg-primary text-on-primary hover:bg-primary-container active:scale-[0.99] font-label-lg text-label-lg py-3 rounded-lg shadow-sm transition-all duration-200 flex items-center justify-center gap-2 font-semibold" type="submit">
<span>เข้าสู่ระบบ (Sign In)</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>

</div>

ยังไม่มีบัญชี? 
<a class="font-semibold text-primary hover:underline ml-1" href="#">สมัครสมาชิกใหม่</a>
</p>

<script>
  let currentLoginType = 'student';

  const tabEmail = document.getElementById('tabEmail');
  const tabStudent = document.getElementById('tabStudent');
  const inputLeadIcon = document.getElementById('inputLeadIcon');
  const identifierInput = document.getElementById('identifierInput');
  const inputLabel = document.getElementById('inputLabel');

  tabEmail.addEventListener('click', () => {
    currentLoginType = 'email';
    tabEmail.className = 'py-2 rounded-md font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold flex items-center justify-center gap-1.5';
    tabStudent.className = 'py-2 rounded-md font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface font-medium flex items-center justify-center gap-1.5';
    inputLeadIcon.textContent = 'mail';
    identifierInput.placeholder = 'teacher@exampro.edu หรือชื่อผู้ใช้';
    inputLabel.firstElementChild.textContent = 'อีเมล หรือ ชื่อผู้ใช้งาน';
  });

  tabStudent.addEventListener('click', () => {
    currentLoginType = 'student';
    tabStudent.className = 'py-2 rounded-md font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold flex items-center justify-center gap-1.5';
    tabEmail.className = 'py-2 rounded-md font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface font-medium flex items-center justify-center gap-1.5';
    inputLeadIcon.textContent = 'badge';
    identifierInput.placeholder = 'EXP-2026-XXXXX';
    inputLabel.firstElementChild.textContent = 'รหัสประจำตัวผู้สอบ / Student ID';
  });

  // Toggle Password
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('passwordInput');
  const togglePasswordIcon = document.getElementById('togglePasswordIcon');
  togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    togglePasswordIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
  });

  // ส่งข้อมูลเข้าสู่ระบบไปยัง Cloudflare D1 Auth API
  async function handleLoginSubmit(e) {
    e.preventDefault();
    const identifier = identifierInput.value;
    const password = passwordInput.value;
    const btn = document.getElementById('btnSubmitLogin');

    btn.disabled = true;
    btn.innerHTML = `<span>กำลังเข้าสู่ระบบ...</span>`;

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          identifier,
          password,
          loginType: currentLoginType
        })
      });

      const data = await res.json();
      if (data.success) {
        // บันทึก Single Session Token และข้อมูลผู้ใช้
        localStorage.setItem('kru_active_session', data.token);
        localStorage.setItem('kru_user_info', JSON.stringify(data.user));
        location.href = 'index.html';
      } else {
        alert(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
      }
    } catch (err) {
      alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<span>เข้าสู่ระบบ (Sign In)</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>`;
    }
  }
</script>
